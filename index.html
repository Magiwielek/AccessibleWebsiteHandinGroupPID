
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="css/epicostylo.css">
</head>

<body>

<div class="page">

    <header>
        <h1>Student Registration</h1>
    </header>

    <main class="content">

        <form>

            <div class="field">
                <label for="roll">Roll Number:</label>
                <input type="text" id="roll" minlength="3" maxlength="21" placeholder="Enter Roll Number" required>
            </div>

            <div class="field">
                <label for="name">Student's Name:</label>
                <input type="text" id="name" minlength="3" maxlength="21" placeholder="Enter Student's Name" required>
            </div>

            <div class="field">
                <label for="fatherName">Father's Name:</label>
                <input type="text" id="fatherName" minlength="3" maxlength="21" placeholder="Enter Father's Name" required>
            </div>

            <div class="field">
                <label for="dob">Birth date:</label>
                <input type="date" id="dob" required>
            </div>

            <div class="field">
                <label for="phone">Mobile Phone:</label>
                <input type="tel" id="phone" aria-describedby="phoneNumber" placeholder="Enter Mobile Phone" pattern="[0-9]{8}" required>
                <small id="phoneNumber">
                Enter your phone number (8 numbers).
                </small>    
            </div>

            <div class="field">
                <label for="email">Email:</label>
                <input type="email" id="email" aria-describedby="emailAdress" placeholder="Enter your email" pattern=".+@.+" title="Email must contain an @ symbol" required>
                <small id="emailAdress">
                Enter your email adresss (must contain "@").
                </small>    
            </div>

            <div class="field">
                <label for="password">Password:</label>
                <input type="password" id="password" aria-describedby="passworddesc" placeholder="Enter your password" pattern="(?=.*[A-Z])(?=.*[^A-Za-z0-9]).+" title="Password must contain at least one uppercase letter and one special character" required>
                <small id="passworddesc">
                Enter your password (1 special letter, 1 big letter)
                </small>  
            </div>

            <div class="field">
                <label for="confirmPassword">Confirm Password:</label>
                <input type="password" id="confirmPassword" aria-describedby="confirmPassworddesc" placeholder="Confirm your password" required>
                <small id="confirmPassworddesc">
                Enter your password (same as password)
                </small>  
            </div>

            <div class="field">
                <p>Gender:</p>

                <div class="gender-options">
                    <label>
                        <input type="radio" name="gender" value="male" required>
                        Male
                    </label>

                    <label>
                        <input type="radio" name="gender" value="female">
                        Female
                    </label>
                </div>
            </div>

            <div class="field">
                <label for="department">Department:</label>

                <select id="department" required>
                    <option value="">Select Department</option>
                    <option value="cs">Computer Science</option>
                    <option value="engineering">Engineering</option>
                    <option value="business">Business</option>
                </select>
            </div>

            <div class="field">
                <label for="course">Course:</label>

                <select id="course" required>
                    <option value="">Select Course</option>
                    <option value="software">Software Engineering</option>
                    <option value="web">Web Development</option>
                    <option value="data">Data Science</option>
                </select>
            </div>

            <div class="field photo-field">
                <label for="photo">Student Photo:</label>
                <input type="file" id="photo" aria-describedby="photodesc" accept="image/*">
                <small id="photodesc">
                Photo is optional*
                </small>  
            </div>

            <div class="field">
                <label for="city">City:</label>
                <input type="text" id="city" placeholder="Enter City" required>
            </div>

            <div class="field">
                <label for="address">Address:</label>
                <textarea id="address" placeholder="Enter Address" required></textarea>
            </div>

            <button type="submit">Register</button>

        </form>

        <div class="photo-box">
            <img src="images/Artur+Lukasz.jpg" alt="Student Image">
        </div>

    </main>

    <footer>
        <p>© 2026 Group 6. All rights reserved. HXG5</p>
    </footer>

</div>

</body>
</html>
