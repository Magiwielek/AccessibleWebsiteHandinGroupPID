
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="css/epicostylo.css">
</head>

<body>

<div class="page">

    <!-- Header -->
    <header>
        <h1>Student Registration</h1>
    </header>

    <main class="content">

        <!-- Registration form -->
        <form>

            <!-- Roll Number -->
            <div class="field">
                <label for="roll">Roll Number:</label>
                <input type="text" id="roll" aria-describedby="Roll number" placeholder="Enter Roll Number">
            </div>

            <!-- Student Name -->
            <div class="field">
                <label for="name">Student's Name:</label>
                <input type="text" id="name" aria-describedby="Student's name" placeholder="Enter Student's Name">
            </div>

            <!-- Father's Name -->
            <div class="field">
                <label for="fatherName">Father's Name:</label>
                <input type="text" id="fatherName" aria-describedby="Father's name" placeholder="Enter Father's Name">
            </div>

            <!-- Birthday -->
            <div class="field">
                <label for="dob">Birth date:</label>
                <input type="date" aria-describedby="Birthdate" id="dob">
            </div>

            <!-- Mobile Phone -->
            <div class="field">
                <label for="phone">Mobile Phone:</label>
                <input type="tel" id="phone" aria-describedby="Phone number" placeholder="Enter Mobile Phone" pattern="[0-9]{8}">
            </div>

            <!-- Email -->
            <div class="field">
                <label for="email">Email:</label>
                <input type="email" id="email" aria-describedby="Email adress" placeholder="Enter your email" pattern=".+@.+" title="Email must contain an @ symbol">
            </div>

            <!-- Password -->
            <div class="field">
                <label for="password">Password:</label>
                <input type="password" id="password" aria-describedby="Password" placeholder="Enter your password"  pattern="(?=.*[A-Z])(?=.*[^A-Za-z0-9]).+" title="Password must contain at least one uppercase letter and one special character">
            </div>

            <!-- Confirm Password -->
            <div class="field">
                <label for="confirmPassword">Confirm Password:</label>
                <input type="password" aria-describedby="Confirm Password" id="confirmPassword" placeholder="Confirm your password">
            </div>

            <!-- Gender -->
            <div class="field">
                <p>Gender:</p>

                <div class="gender-options">
                    <label>
                        <input type="radio" aria-describedby="male" name="gender" value="male">
                        Male
                    </label>

                    <label>
                        <input type="radio" aria-describedby="female" name="gender" value="female">
                        Female
                    </label>
                </div>
            </div>

            <!-- Department -->
            <div class="field">
                <label for="department">Department:</label>

                <select id="department">
                    <option value="">Select Department</option>
                    <option value="cs">Computer Science</option>
                    <option value="engineering">Engineering</option>
                    <option value="business">Business</option>
                </select>
            </div>

            <!-- Course -->
            <div class="field">
                <label for="course">Course:</label>

                <select id="course">
                    <option value="">Select Course</option>
                    <option value="software">Software Engineering</option>
                    <option value="web">Web Development</option>
                    <option value="data">Data Science</option>
                </select>
            </div>

            <!-- Student Photo -->
            <div class="field photo-field">
                <label for="photo">Student Photo:</label>
                <input type="file" id="photo" accept="image/*">
            </div>

            <!-- City -->
            <div class="field">
                <label for="city">City:</label>
                <input type="text" id="city" placeholder="Enter City">
            </div>

            <!-- Address -->
            <div class="field">
                <label for="address">Address:</label>
                <textarea id="address" placeholder="Enter Address"></textarea>
            </div>

            <!-- Register Button -->
            <button type="submit" aria-describedby="Register button">Register</button>

        </form>

        <!-- Image on the right -->
        <div class="photo-box">
            <img src="images/Artur+Lukasz.jpg" aria-describedby="Artur and Lucas picture" alt="Student Image">
        </div>

    </main>

    <!-- Footer -->
    <footer>
        <p>© 2026 Group 6. All rights reserved. HXG5</p>
    </footer>

</div>

</body>
</html>
